<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Movie Ticket Booking</h1>

    <div class="movies">

        <div class="movie">
            <h2>Avengers</h2>
            <p>Ticket: ₹200</p>
            <button class="book-btn">Book Ticket</button>
        </div>

        <div class="movie">
            <h2>Inception</h2>
            <p>Ticket: ₹180</p>
            <button class="book-btn">Book Ticket</button>
        </div>

        <div class="movie">
            <h2>Interstellar</h2>
            <p>Ticket: ₹250</p>
            <button class="book-btn">Book Ticket</button>
        </div>

    </div>

    <h2>My Tickets</h2>

    <div id="ticketList"></div>

    <p>Total Tickets: <span id="ticketCount">0</span></p>
    <p>Total Amount: ₹<span id="total">0</span></p>

    <button id="bookBtn">Confirm Booking</button>

    <script src="script.js"></script>

</body>
</html>
